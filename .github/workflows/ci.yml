name: CI
on:
  push:
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 单元测试
        run: npm test
      - name: Lint
        run: npm run lint
      - name: 构建（含数据校验）
        run: node build/build.mjs
      - name: 数据审计
        run: node scripts/audit.mjs
